services:
  # PHP-FPM Application (Debian-based)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rekakarsacipta
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - rkc_network

  # Nginx Web Server
  web:
    image: nginx:latest
    container_name: rekakarsacipta_nginx
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - .:/var/www
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - rkc_network
    depends_on:
      - app

networks:
  rkc_network:
    driver: bridge

volumes:
  db_data: